[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-packet"
version = "0.1.0"
description = "Turn a messy folder of dispute evidence into a clean, hashed, indexed packet."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
evidence-packet = "evidence_packet:main"

[tool.setuptools]
py-modules = ["evidence_packet"]
